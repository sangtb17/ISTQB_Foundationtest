services:
  - type: web
    name: istqb-html-manager
    runtime: docker
    plan: free
    dockerfilePath: ./html_web_app/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: PYTHONUTF8
        value: 1
      - key: FLASK_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: MAX_CONTENT_MB
        value: 16
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
